# Automatischer Testlauf: bei jedem Push und jedem Pull Request laufen die
# PHPUnit-Tests aus wert/tests auf allen unterstuetzten PHP-Versionen,
# dazu php -l fuer jede Datei und einmal PHPStan (seit 4.9.5).
# Die Tests brauchen keine Datenbank: Sie bauen sich je Test eine SQLite-
# Datenbank im Speicher aus install/schema.sql.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    defaults:
      run:
        working-directory: wert
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sodium, zip, gd, intl
          coverage: none

      - name: PHPUnit und PHPStan installieren
        run: composer install --no-interaction --no-progress --prefer-dist

      # Syntaxpruefung jeder PHP-Datei mit der jeweiligen PHP-Version (4.9.5)
      - name: Syntax (php -l)
        run: git ls-files '*.php' | xargs -n1 -P4 php -l -d display_errors=1 > /dev/null

      - name: Tests
        run: vendor/bin/phpunit

      # Statische Analyse (phpstan.neon.dist, Stufe 5 mit Baseline) - einmal
      # genuegt, sie haengt nicht von der PHP-Version ab (4.9.5)
      - name: Statische Analyse (PHPStan)
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
