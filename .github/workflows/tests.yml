# Automatischer Testlauf: bei jedem Push und jedem Pull Request laufen die
# PHPUnit-Tests aus wert/tests auf allen unterstuetzten PHP-Versionen.
# Die Tests brauchen keine Datenbank: Sie bauen sich je Test eine SQLite-
# Datenbank im Speicher aus install/schema.sql.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    defaults:
      run:
        working-directory: wert
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sodium, zip, gd, intl
          coverage: none

      - name: PHPUnit installieren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: vendor/bin/phpunit
